name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # These examples install on their own so their lockfiles and overrides
      # stay independent of the repository workspace.
      - name: Install standalone example dependencies
        run: |
          bun install --frozen-lockfile --cwd platform-examples
          bun install --frozen-lockfile --cwd platform/plugin-workspace/deploy/platform

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint


      - name: Test
        run: bun test --coverage
